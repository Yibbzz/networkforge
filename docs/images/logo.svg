<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" role="img" aria-label="NetworkForge">
  <title>NetworkForge</title>
  <!-- Colours chosen to read on both light and dark pages; the word
       "Network" follows the reader's colour scheme where the viewer allows. -->
  <style>
    .word { font: 600 40px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.5px; }
    .network { fill: #4a5560; }
    .forge { fill: #e8590c; }
    .sub { font: 500 22px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7b8792; }
    @media (prefers-color-scheme: dark) { .network { fill: #c9d1d9; } }
  </style>
  <g transform="translate(8 8) scale(2)">
    <g fill="none" stroke="#7b8792" stroke-width="2.5" stroke-linecap="round">
      <path d="M5 26 L13 16 L27 14"/>
      <path d="M13 16 L9 5"/>
    </g>
    <path d="M9 5 L27 14" fill="none" stroke="#e8590c" stroke-width="3" stroke-linecap="round"/>
    <g fill="#ffffff" stroke="#7b8792" stroke-width="1.5">
      <circle cx="5" cy="26" r="2.5"/>
      <circle cx="13" cy="16" r="2.5"/>
      <circle cx="27" cy="14" r="2.5"/>
      <circle cx="9" cy="5" r="2.5"/>
    </g>
  </g>
  <text x="84" y="54" class="word"><tspan class="network">Network</tspan><tspan class="forge">Forge</tspan></text>
</svg>
