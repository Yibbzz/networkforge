name: release

# Push a version tag to publish a GitHub Release and upload to PyPI:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match `version` in pyproject.toml, and CHANGELOG.md needs
# a "## [0.2.0]" section (it becomes the release notes).
#
# PyPI upload uses Trusted Publishing (no token stored in GitHub): on
# pypi.org the project's publisher is this repo, workflow `release.yml`,
# environment `pypi`.

#
# This workflow publishes, so everything it runs is fixed: each action by
# its commit (the tag in the comment says which release that is), the
# packages by uv.lock. To move to a newer action, change both.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # tests and the build don't need the token

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Install
        run: uv sync --locked

      - name: Lint and test
        run: |
          uv run ruff check .
          uv run pytest
          uv run pytest -m "valhalla and not network"

      - name: Build
        run: uv build

      - name: Check the package metadata (what PyPI shows)
        run: uvx twine check --strict dist/*

      - name: Smoke-test the built package
        run: uv run --isolated --no-project --with dist/*.whl networkforge --version

      - name: Keep the built files for the PyPI job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "NetworkForge $VERSION" --notes-file notes.md

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/networkforge/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
