name: release

# Push a version tag to publish a GitHub Release:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match `version` in pyproject.toml, and CHANGELOG.md needs
# a "## [0.2.0]" section (it becomes the release notes).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Install
        run: uv sync --locked

      - name: Lint and test
        run: |
          uv run ruff check .
          uv run pytest

      - name: Build
        run: uv build

      - name: Smoke-test the built package
        run: uv run --isolated --no-project --with dist/*.whl networkforge --version

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "NetworkForge $VERSION" --notes-file notes.md
