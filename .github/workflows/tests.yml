name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # nightly, 03:00 UTC
  workflow_dispatch:     # "Run workflow" button in the Actions tab

jobs:
  offline:
    name: Lint + offline tests
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # The Valhalla tests have their own job below.
      - name: Offline tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # Optional: add a CODECOV_TOKEN repo secret (codecov.io, free for
      # public repos) to get coverage history, PR comments and a badge.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  windows:
    name: Offline tests on Windows
    # Most people who use the QGIS plugin are on Windows. What differs
    # there is mostly file names: tests/integration/test_file_names.py
    # builds in folders with accents, which osmium can't open by itself.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Offline tests
        run: uv run pytest

      # Traffic runs pyvalhalla's programs, which on Windows only find
      # their libraries if PATH is set for them (v1.2.0 missed it).
      - name: Traffic in Valhalla
        run: uv run pytest -m valhalla tests/valhalla/test_traffic.py -v

  valhalla:
    name: PBF in Valhalla
    # Builds before / after networks, builds Valhalla's routing graph from
    # each PBF (pyvalhalla, pinned in pyproject.toml - no server or Docker)
    # and checks the routes: every tag rule and every way a custom line
    # can join the network. See docs/network-analyst.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Route on the exported PBF with Valhalla
        run: uv run pytest -m valhalla -v

  r5:
    name: PBF in R5
    # Builds before / after networks and works out trip times on each PBF
    # with Conveyal R5 (r5py, pinned in pyproject.toml's r5 group), the
    # engine behind transport-accessibility tools such as Easy-R5.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --group r5

      - name: Route on the exported PBF with R5
        run: uv run pytest -m r5 -v

  qgis:
    name: GeoPackage in QGIS ${{ matrix.qgis }}
    # Routes on the GeoPackage with QGIS's own network analysis tools
    # (qgis_process) and checks QGIS finds the expected routes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        qgis: [ltr, latest]  # qgis/qgis Docker image tags
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the test GeoPackage and expected routes
        run: |
          uv sync --locked
          uv run python -m tests.qgis.make_fixture qgis-fixture

      - name: Route on it in QGIS
        run: |
          docker run --rm -e QT_QPA_PLATFORM=offscreen \
            -v "$PWD:/work" -w /work "qgis/qgis:${{ matrix.qgis }}" \
            sh -c "qgis_process --version && python3 tests/qgis/check_with_qgis.py qgis-fixture"

  live:
    name: Live OSM tests + deep property tests
    # Slow and depends on Overpass, so not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Live city tests
        run: uv run pytest -m network -v

      - name: Property tests (500 examples)
        if: always()
        env:
          HYPOTHESIS_PROFILE: thorough
        run: >
          uv run pytest -m "not network"
          tests/integration/test_properties.py tests/valhalla/test_random_lines.py -v
