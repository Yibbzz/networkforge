name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # nightly, 03:00 UTC
  workflow_dispatch:     # "Run workflow" button in the Actions tab

jobs:
  offline:
    name: Lint + offline tests
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Offline tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # Optional: add a CODECOV_TOKEN repo secret (codecov.io, free for
      # public repos) to get coverage history, PR comments and a badge.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  live:
    name: Live OSM tests + deep property tests
    # Slow and depends on Overpass, so not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Live city tests
        run: uv run pytest -m network -v

      - name: Property tests (500 examples)
        if: always()
        env:
          HYPOTHESIS_PROFILE: thorough
        run: uv run pytest tests/integration/test_properties.py -v
