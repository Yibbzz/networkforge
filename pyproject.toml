[project]
name = "networkforge"
version = "0.1.0"
description = "Build routable networks from OpenStreetMap and proposed infrastructure"
requires-python = ">=3.12"

dependencies = [
    "geopandas",
    "shapely",
    "pandas",
    "osmnx",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest",
]
