[project]
name = "networkforge"
version = "0.11.1"
description = "Build and edit routable street networks from GIS layers: add to, change or replace OpenStreetMap; output OSM PBF and GeoPackage"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["openstreetmap", "osm", "routing", "transport", "network", "gis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

# Lower bounds are the APIs the code relies on (e.g. shapely 2 vectorised
# functions, geopandas 1 sjoin). OSMnx is capped below 3: modes.py parses
# its private network filters, which a major release may change.
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "osmnx>=2.0,<3",
    "networkx>=3.0",
    "pyproj>=3.6",
    "requests>=2.31",
    # Not imported directly: OSMnx needs it for nearest_nodes() on
    # unprojected (lat/lon) graphs, used when routing between points.
    "scikit-learn>=1.3",
    "osmium>=4.0",
]

[project.scripts]
networkforge = "networkforge.cli:main"

[project.urls]
Homepage = "https://github.com/Yibbzz/networkforge"
Documentation = "https://github.com/Yibbzz/networkforge/blob/main/docs/tagging-guide.md"
Changelog = "https://github.com/Yibbzz/networkforge/blob/main/CHANGELOG.md"
Issues = "https://github.com/Yibbzz/networkforge/issues"

# Makes `uv sync` install networkforge itself (editable), so imports work
# anywhere - CI included - without PYTHONPATH=src.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# What ships: the package, plus (in the source archive) docs and tests.
[tool.hatch.build.targets.wheel]
packages = ["src/networkforge"]

[tool.hatch.build.targets.sdist]
include = [
    "src/networkforge",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
]
exclude = ["tests/commands.txt"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.2",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    # The router the QGIS Network Analyst plugin runs; tests/valhalla route
    # on the exported PBF with it. Pinned: Valhalla's routing rules change
    # between versions, so an upgrade is a deliberate step (re-run the
    # tests, update tests/valhalla/harness.py VALHALLA_VERSION).
    "pyvalhalla==3.9.0",
]

[tool.pytest.ini_options]
markers = [
    "network: downloads live OSM data (run with: uv run pytest -m network)",
    "valhalla: routes on the exported PBF with Valhalla (tests/valhalla; needs pyvalhalla)",
]
# Fast and offline by default; a `-m` on the command line overrides this:
# `-m valhalla` (routing tests, a few minutes), `-m network` (live OSM).
addopts = "-m 'not network and not valhalla'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused/undefined names), I: import order,
# B: bugbear (likely bugs), UP: modern syntax for the target Python.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["networkforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# CI fails if offline coverage drops below this. Raise it as tests grow.
fail_under = 88
